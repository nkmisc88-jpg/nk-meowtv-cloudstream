name: Build

permissions:
  contents: write

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: |
          rm -f "$GITHUB_WORKSPACE/builds/"*.cs3
          rm -f "$GITHUB_WORKSPACE/builds/"*.jar
          rm -f "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        working-directory: src
        run: |
          chmod +x gradlew

          ./gradlew make makePluginsJson

          ./gradlew ensureJarCompatibility

          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds/"

          cp **/build/*.jar "$GITHUB_WORKSPACE/builds/"

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

      - name: Verify MeowTV metadata
        run: |
          echo "Checking MeowTVProvider metadata..."
          grep -A25 -B5 '"internalName": "MeowTVProvider"' \
            "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Push builds
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build $GITHUB_SHA"

          git push origin HEAD:builds