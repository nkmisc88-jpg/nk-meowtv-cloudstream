name: Build

permissions:
  contents: write

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: |
          rm -f "$GITHUB_WORKSPACE/builds/"*.cs3
          rm -f "$GITHUB_WORKSPACE/builds/"*.jar
          rm -f "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        working-directory: src
        run: |
          chmod +x gradlew

          ./gradlew make makePluginsJson

          ./gradlew ensureJarCompatibility

          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds/"

          cp **/build/*.jar "$GITHUB_WORKSPACE/builds/"

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

      - name: Verify MeowTV metadata
        run: |
          python3 - <<'PY'
          import json

          path = "/home/runner/work/${GITHUB_REPOSITORY##*/}/${GITHUB_REPOSITORY##*/}/builds/plugins.json"

          with open(path, "r", encoding="utf-8") as f:
              plugins = json.load(f)

          meow = next(
              (p for p in plugins
               if p.get("internalName") == "MeowTVProvider"),
              None
          )

          if meow is None:
              raise SystemExit("ERROR: MeowTVProvider not found")

          print("===== MeowTVProvider =====")
          print("name:", meow.get("name"))
          print("internalName:", meow.get("internalName"))
          print("version:", meow.get("version"))
          print("status:", meow.get("status"))
          print("url:", meow.get("url"))
          print("==========================")

          if meow.get("status") != 1:
              raise SystemExit(
                  f"ERROR: MeowTV status is {meow.get('status')}, expected 1"
              )

          if meow.get("version") != 2:
              raise SystemExit(
                  f"ERROR: MeowTV version is {meow.get('version')}, expected 2"
              )

          print("SUCCESS: MeowTV metadata is correct.")
          PY

      - name: Push builds
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build $GITHUB_SHA"

          git push origin HEAD:builds